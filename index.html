<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Traceability record</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#012527; --lime:#64C01E; --lime-deep:#3D7A16; --lime-tint:#EEF8E4;
    --ink:#0E1A1A; --muted:#66716F; --faint:#B2BAB8; --hair:#E4E7E6;
    --warn:#B5820A; --warn-tint:#FDF3D6; --bg:#F4F6F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5;padding:0 16px 48px}
  .wrap{max-width:560px;margin:0 auto}

  header{text-align:center;padding:36px 0 22px}
  header img{width:150px;height:auto}
  .farmname{font-size:21px;font-weight:700;color:var(--dark);line-height:1.25}
  .kicker{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--lime-deep);font-weight:600;margin-top:14px}
  .refline{font-size:13px;color:var(--muted);margin-top:6px}
  .refline b{color:var(--ink);font-weight:600}

  .card{background:#fff;border:1px solid var(--hair);border-radius:14px;
    padding:18px 18px;margin-top:14px;box-shadow:0 2px 10px rgba(1,37,39,.05)}
  .card h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:12px}

  .method{background:var(--lime-tint);border:none}
  .method p{font-size:14px;color:var(--lime-deep);font-weight:500;line-height:1.6}

  .item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
    border-bottom:1px solid var(--hair)}
  .item:last-child{border-bottom:none}
  .item .nm{font-size:14px;font-weight:600;color:var(--ink)}
  .item .sub{font-size:11px;color:var(--lime-deep);margin-top:3px}
  .item .wt{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;
    text-align:right;font-variant-numeric:tabular-nums}
  .item .measure{display:block;font-size:11px;font-weight:500;color:var(--muted);
    margin-top:2px}
  .weight-note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--hair)}

  .animal{border:1px solid var(--hair);border-radius:12px;padding:15px;margin-top:10px}
  .animal:first-of-type{margin-top:0}
  .animal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .animal .tag{font-size:15px;font-weight:700;color:var(--dark)}
  .animal .kind{font-size:12px;color:var(--muted);margin-top:2px}
  .chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .chip.ok{background:var(--lime-tint);color:var(--lime-deep)}
  .chip.warn{background:var(--warn-tint);color:var(--warn)}
  .rows{margin-top:12px;display:grid;gap:9px}
  .row{display:flex;gap:10px;font-size:13px}
  .row .k{color:var(--muted);flex:0 0 116px}
  .row .v{color:var(--ink);flex:1}
  .row .v .tagline{color:var(--muted);font-size:12px}
  .meds{margin-top:3px;display:grid;gap:5px}
  .med{font-size:12.5px;color:var(--ink)}
  .med .w{color:var(--muted)}
  .clean{font-size:13px;color:var(--lime-deep);font-weight:500}

  footer{text-align:center;font-size:11px;color:var(--faint);margin-top:26px;line-height:1.8}
  footer b{color:var(--lime-deep)}

  .state{text-align:center;padding:60px 20px;color:var(--muted)}
  .state h1{font-size:18px;color:var(--ink);margin-bottom:8px}
  .spinner{width:26px;height:26px;border:3px solid var(--hair);border-top-color:var(--lime);
    border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="state">
    <div class="spinner"></div>
    Looking up this record…
  </div>

  <div id="notfound" class="state hidden">
    <h1>Record not found</h1>
    <p>This link doesn’t match a record we hold. It may have expired, or the
       code may be mistyped.</p>
  </div>

  <div id="record" class="hidden">
    <header>
      <div class="farmname" id="farm-head"></div>
      <div class="kicker">Traceability record</div>
      <div class="refline"><b id="ref"></b> · <span id="date"></span></div>
    </header>

    <div class="card method"><p id="method"></p></div>

    <div class="card">
      <h2 id="items-title">What you bought</h2>
      <div id="items"></div>
      <p id="weight-note" class="weight-note hidden"></p>
    </div>

    <div class="card">
      <h2>The animals behind it</h2>
      <div id="animals"></div>
    </div>

    <footer>
      <div><b id="farm"></b></div>
      <div id="farm-contact"></div>
      <div style="margin-top:8px" id="farm-claim"></div>
    </footer>
  </div>

</div>

<script>
  // The anon/publishable key is public by design — it ships in the mobile app.
  // Every byte of exposure is decided by public.trace_disclosure(), which
  // returns only the disclosure payload for one token (traceability.md §4).
  const SUPABASE_URL = 'https://eexgyyzsycdscfjkqaxu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_G-d7lJcxF1W3r5-43ObfdQ_fR5EwU8R';

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDate = s => {
    if (!s) return '';
    const d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s;
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // token = last path segment (/t/{token}) or ?t= fallback
  function readToken() {
    const q = new URLSearchParams(location.search).get('t');
    if (q) return q.trim();
    const parts = location.pathname.split('/').filter(Boolean);
    const i = parts.indexOf('t');
    if (i >= 0 && parts[i+1]) return parts[i+1];
    return parts.length ? parts[parts.length - 1] : '';
  }

  function show(id) {
    for (const s of ['loading','notfound','record'])
      document.getElementById(s).classList.toggle('hidden', s !== id);
  }

  function originLine(a) {
    if (a.origin === 'born_on_farm')
      return 'Born on farm' + (a.born_on ? ' · ' + fmtDate(a.born_on) : '');
    if (a.origin === 'purchased') return 'Purchased and finished on this farm';
    return '';
  }

  function healthChip(h) {
    if (!h) return '';
    const label = {healthy:'Healthy', under_treatment:'Under treatment',
                   not_fit_for_consumption:'Not fit for consumption'}[h] || h;
    const cls = h === 'healthy' ? 'ok' : 'warn';
    return `<span class="chip ${cls}">${esc(label)}</span>`;
  }

  function renderAnimal(a) {
    const feed = (a.feed || []).map(f => esc(f.name)).filter(Boolean);
    const meds = a.medications || [];
    const rows = [];

    const origin = originLine(a);
    if (origin) rows.push(['Origin', esc(origin)]);
    if (a.days_on_farm != null)
      rows.push(['Days on farm', `${a.days_on_farm} days`]);
    if (a.final_weight_kg != null)
      rows.push(['Live weight', `${Number(a.final_weight_kg).toFixed(1)} kg`]);
    if (feed.length)
      rows.push(['Feed', feed.join(' · ')]);

    // medication — the record that demonstrates control rather than asserting it
    let medHtml;
    if (meds.length) {
      medHtml = '<div class="meds">' + meds.map(m =>
        `<div class="med">${esc(m.name)}` +
        (m.given_on ? ` <span class="w">· given ${fmtDate(m.given_on)}` +
          (m.withdrawal_until ? `, withdrawal cleared ${fmtDate(m.withdrawal_until)}` : '') +
          `</span>` : '') + `</div>`).join('') + '</div>';
    } else {
      medHtml = '<div class="clean">No medication administered</div>';
    }
    rows.push(['Medication', medHtml]);

    const meta = [a.breed, a.sex].filter(Boolean).map(esc).join(' · ');
    return `<div class="animal">
      <div class="top">
        <div>
          <div class="tag">${esc(a.tag || 'Animal')}</div>
          ${a.current_tag ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">now tagged <b style="color:var(--ink)">${esc(a.current_tag)}</b></div>` : ''}
          ${meta ? `<div class="kind">${meta}</div>` : ''}
        </div>
        ${healthChip(a.health)}
      </div>
      <div class="rows">
        ${rows.map(([k,v]) => `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
      </div>
    </div>`;
  }

  function renderItem(it) {
    const sub = [];
    if (it.batch_refs && it.batch_refs.length) sub.push('Batch ' + it.batch_refs.map(esc).join(', '));
    if (it.animal_count) sub.push(it.animal_count === 1 ? '1 animal' : `${it.animal_count} animals`);
    const wt = it.weight_kg != null ? `${Number(it.weight_kg).toFixed(1)} kg` : '';
    // Only name carcass weight when the disclosure says that explicitly.
    // Older payloads called any animal-linked line "live", even for a carcass
    // sale, so leaving those unlabelled is safer during a staggered deploy.
    const measure = it.kind === 'carcass' && wt ? 'carcass weight' : '';
    return `<div class="item">
      <div>
        <div class="nm">${esc(it.label)}</div>
        ${sub.length ? `<div class="sub">${sub.join(' · ')}</div>` : ''}
      </div>
      <div class="wt">${wt}${measure ? `<span class="measure">${measure}</span>` : ''}</div>
    </div>`;
  }

  function render(d) {
    document.getElementById('ref').textContent = d.reference || (d.kind === 'batch' ? 'Batch' : 'Record');
    document.getElementById('date').textContent = fmtDate(d.date);
    // No sentence means the records do not support one — hide the panel rather
    // than leave an empty card implying something was withheld.
    document.getElementById('method').textContent = d.method || '';
    document.querySelector('.card.method').style.display = d.method ? '' : 'none';
    // The seller names itself or is not named. There is no house default: this
    // page serves every farm on the platform, and printing one farm's identity
    // on another's record is the fault this replaced.
    const farm = d.farm || '';
    document.getElementById('farm').textContent = farm;
    document.getElementById('farm-head').textContent = farm;
    if (farm) document.title = farm + ' — Traceability record';
    const contact = [d.farm_address, d.farm_phone, d.farm_email]
      .filter(Boolean).join(' · ');
    document.getElementById('farm-contact').textContent = contact;
    // Only claim record-keeping when the server found records to back it.
    document.getElementById('farm-claim').textContent = d.method
      ? 'Every claim here is backed by records ' + (farm || 'this farm') + ' keeps.'
      : '';
    document.getElementById('items-title').textContent =
      d.kind === 'batch' ? 'Cuts in this batch' : 'What you bought';
    const items = d.items || [];
    const animals = d.animals || [];
    document.getElementById('items').innerHTML =
      items.map(renderItem).join('') || '<div class="item"><div class="nm">—</div></div>';
    const weightNote = document.getElementById('weight-note');
    const comparesCarcassWithLive =
      items.some(it => it.kind === 'carcass' && it.weight_kg != null) &&
      animals.some(a => a.final_weight_kg != null);
    weightNote.textContent = comparesCarcassWithLive
      ? 'Carcass weight and animal live weight are different measures, so the figures are not expected to match.'
      : '';
    weightNote.classList.toggle('hidden', !comparesCarcassWithLive);
    document.getElementById('animals').innerHTML =
      animals.map(renderAnimal).join('') ||
      // Roughly a hundred invoices went out carrying a QR before the app
      // stopped printing one for sales with nothing behind them (0161). Those
      // codes are in customers' hands and cannot be recalled, so this says what
      // is true rather than showing a bare "No animal records." — which reads,
      // to someone who scanned expecting provenance, like the claim failing.
      '<div class="clean">Animal-level records were not kept for this sale. ' +
      'The purchase details above are what this farm holds for it.</div>';
    show('record');
  }

  async function main() {
    const token = readToken();
    if (!token) { show('notfound'); return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/trace_disclosure`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
        },
        body: JSON.stringify({ p_token: token }),
      });
      if (!res.ok) { show('notfound'); return; }
      const data = await res.json();
      if (!data || data.found !== true) { show('notfound'); return; }
      render(data);
    } catch (e) {
      show('notfound');
    }
  }
  main();
</script>
</body>
</html>
